# Copy to .github/workflows/ci.yml in a product repo.
name: ci

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  ci:
    uses: Themekraft/release-tooling/.github/workflows/ci.yml@main
    with:
      slug: learndash-pfl
      # Premium-only product, not on wordpress.org, but kept Plugin Check clean (TKT-138).
      plugin-check: true
    secrets: inherit
